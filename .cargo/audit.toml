[advisories]
ignore = [
    # Existing exceptions until object_store upgrades to quick-xml >= 0.41.0:
    # https://github.com/apache/datafusion/issues/23297
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Arrow 59 and compression-codecs require zstd 0.13 / zstd-safe 7.
    # Remove these exceptions when they support zstd >= 0.14.3 / zstd-safe >= 8.2.0.
    # No DataFusion, Arrow, Parquet, or compression-codecs caller uses the raw
    # Encoder/Decoder::with_context APIs that reuse an abandoned stream's context.
    # Reassess this exception when changing compression code or its dependencies.
    "RUSTSEC-2026-0391",
    # The legacy-frame decoder and seekable APIs are disabled. The audit workflow
    # checks the resolved all-features graph so enabling either fails CI.
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0398",
]
